name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (${{ matrix.service }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - pet-service
          - order-service
          - payment-service
          - notification-service
          - statistics-service

    env:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.service == 'pet-service' && 'pet_db' || matrix.service == 'user-service' && 'user_db' || matrix.service == 'order-service' && 'order_db' || matrix.service == 'payment-service' && 'payment_db' || matrix.service == 'notification-service' && 'notification_db' || 'postgres' }}?TimeZone=Asia/Ho_Chi_Minh
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      JWT_SECRET: bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u
      JWT_EXPIRATION: 86400000
      API_KEY: test-api-key
      KEYCLOAK_CLIENT_SECRET: test-client-secret
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
      KEYCLOAK_JWK_URI: http://localhost:8088/realms/super-petmark-3d/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/super-petmark-3d
      KEYCLOAK_SERVER_URL: http://localhost:8088
      KEYCLOAK_REALM: super-petmark-3d
      KEYCLOAK_CLIENT_ID: user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '${{ matrix.service }}/pom.xml'

      - name: Initialize PostgreSQL Databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE user_db;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE pet_db;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE order_db;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE payment_db;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE notification_db;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE keycloak_db;" || true

      - name: Grant execute permissions to Maven wrapper
        run: |
          if [ -f "${{ matrix.service }}/mvnw" ]; then
            chmod +x ${{ matrix.service }}/mvnw
          fi

      - name: Build & Test Microservice
        working-directory: ./${{ matrix.service }}
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw clean test package
          else
            mvn clean test package
          fi

  frontend-ci:
    name: Frontend CI (${{ matrix.frontend }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        frontend:
          - frontend-client-nextjs
          - frontend-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.frontend }}/package-lock.json'

      - name: Install dependencies
        working-directory: ./${{ matrix.frontend }}
        run: npm ci

      - name: Run ESLint
        working-directory: ./${{ matrix.frontend }}
        continue-on-error: true
        run: npm run lint

      - name: Build Frontend App
        working-directory: ./${{ matrix.frontend }}
        run: npm run build

  docker-compose-ci:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Build Docker Images
        run: docker compose build --parallel

  ci-success:
    name: CI Pipeline Status
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-compose-ci]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ] || [ "${{ needs.docker-compose-ci.result }}" != "success" ]; then
            echo "CI Pipeline Failed!"
            exit 1
          fi
          echo "All CI Jobs Passed Successfully!"
