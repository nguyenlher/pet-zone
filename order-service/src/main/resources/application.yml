spring:
  application:
    name: order-service
  
  config:
    import:
      - classpath:kafka-config.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/order_db?TimeZone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    enabled: true
    changelog: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    drop-first: false

server:
  port: ${SERVER_PORT:8084}

rest:
    api:
        user-service:
            baseUrl: ${USER_SERVICE_URL:http://localhost:8081}
        pet-service:
            baseUrl: ${PET_SERVICE_URL:http://localhost:8082}
        payment-service:
            baseUrl: ${PAYMENT_SERVICE_URL:http://localhost:8085}
