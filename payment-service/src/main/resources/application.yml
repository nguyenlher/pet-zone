spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petstore_payment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8085}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:LPY4D96Y}
  hash-secret: ${VNPAY_HASH_SECRET:FV8MTUFGX90C8FHVN75FB9YX90CRGZKB}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8085/public/payments/callback/VNPAY}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8085/public/payments/vnpay/ipn}
  currency: VND
  version: 2.1.0
  command: pay
  order-type: other

logging:
  level:
    com.petstore.paymentservice: DEBUG
    org.springframework.web: INFO
