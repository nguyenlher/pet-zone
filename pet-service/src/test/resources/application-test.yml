spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pet_db?TimeZone=Asia/Ho_Chi_Minh}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  liquibase:
    enabled: false

  # Disable redis & kafka during JPA repository tests
  data:
    redis:
      repositories:
        enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8088/realms/super-petmark-3d/protocol/openid-connect/certs

keycloak:
  server-url: http://localhost:8088
  realm: super-petmark-3d
  client-id: pet-service
  client-secret: test-secret

cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

api:
  key: test-api-key

jwt:
  secret: bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u
  expiration: 86400000


